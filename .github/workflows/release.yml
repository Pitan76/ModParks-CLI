name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --locked

      - name: Rename binary with version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item target/release/modparks-cli.exe "modparks-cli-${tag}-windows-x86_64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: modparks-cli-windows
          path: modparks-cli-*.exe
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: "ModParks CLI ${{ github.ref_name }}"
          body: |
            ## ModParks CLI ${{ github.ref_name }}

            ### インストール方法
            1. 下記のアセットから `modparks-cli-${{ github.ref_name }}-windows-x86_64.exe` をダウンロード
            2. パスの通ったディレクトリに `modparks-cli.exe` としてコピー

            ### 主なコマンド
            ```
            modparks-cli login <API_KEY>   # API キーを設定
            modparks-cli projects          # プロジェクト一覧
            modparks-cli projects 2        # 2ページ目
            modparks-cli project <slug>    # プロジェクト詳細
            modparks-cli ideas             # アイデア一覧
            modparks-cli tui               # TUI を起動
            modparks-cli cache-clear       # キャッシュをクリア
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/**/*.exe