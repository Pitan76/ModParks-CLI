[package]
name = "modparks-cli"
version = "0.0.1"
edition = "2021"

[dependencies]
clap = { version = "4.2", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.24", features = ["full"] }
dirs = "5.0"
