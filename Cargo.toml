[package]
name = "modparks-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.2", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.24", features = ["full"] }
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
tui-input = "0.10"
